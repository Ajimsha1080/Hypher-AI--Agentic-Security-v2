# ── MCP Security Gateway — Nginx Production Config ──────────────────────
# Place at: /etc/nginx/sites-available/mcpsecurity.dev
# Enable: ln -s /etc/nginx/sites-available/mcpsecurity.dev /etc/nginx/sites-enabled/
# Reload:  nginx -t && systemctl reload nginx
#
# Requirements:
#   - Cloudflare origin cert at /etc/ssl/cloudflare/mcpsecurity.dev.pem
#   - Cloudflare origin key at /etc/ssl/cloudflare/mcpsecurity.dev.key
#   - OR: certbot wildcard cert at /etc/letsencrypt/live/mcpsecurity.dev/
#
# DNS setup (Cloudflare dashboard):
#   Type: A    Name: @              Value: <YOUR_SERVER_IP>  Proxied: YES
#   Type: A    Name: *              Value: <YOUR_SERVER_IP>  Proxied: YES
#   SSL mode: Full (strict)

# ── Rate limiting zones ───────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ── Upstream — Node.js app ────────────────────────────────────────────
upstream mcpsg_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mcpsecurity.dev *.mcpsecurity.dev;
    return 301 https://$host$request_uri;
}

# ── Main domain: mcpsecurity.dev ─────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcpsecurity.dev;

    # Cloudflare origin certificate (preferred — 15yr validity, free)
    ssl_certificate     /etc/ssl/cloudflare/mcpsecurity.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mcpsecurity.dev.key;
    # OR use Let's Encrypt wildcard cert:
    # ssl_certificate     /etc/letsencrypt/live/mcpsecurity.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mcpsecurity.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # No tenant slug — route to main app (login, marketing page)
    location / {
        proxy_pass http://mcpsg_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}

# ── Wildcard subdomains: {slug}.mcpsecurity.dev ───────────────────────
# Each subdomain maps to a cloud tenant. Nginx extracts the slug and passes
# it as X-Tenant-Slug header. The Node app resolves the tenant from DB.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?P<slug>[a-z0-9][a-z0-9\-]{2,31})\.mcpsecurity\.dev$;

    ssl_certificate     /etc/ssl/cloudflare/mcpsecurity.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mcpsecurity.dev.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Rate limiting on API and auth endpoints
    location /mcp {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://mcpsg_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ── THE KEY HEADER: tells Node which tenant this subdomain belongs to ──
        proxy_set_header X-Tenant-Slug $slug;
        proxy_read_timeout 60s;
    }

    location /api/auth {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://mcpsg_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $slug;
    }

    # WebSocket upgrade for /ws endpoint
    location /ws {
        proxy_pass http://mcpsg_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $slug;
        proxy_read_timeout 86400s;   # 24h for long-lived WS connections
        proxy_send_timeout 86400s;
    }

    # All other routes
    location / {
        proxy_pass http://mcpsg_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass tenant slug on every route so dashboard and API work correctly
        proxy_set_header X-Tenant-Slug $slug;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
