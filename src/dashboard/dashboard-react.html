<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Security Gateway — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<!-- React 18 + TypeScript via CDN for zero-build-step enterprise deployment -->
<!-- In production: replace with Vite + React build for full TypeScript/JSX support -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
/* ── DESIGN TOKENS (same as original dashboard for consistency) ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060809;--s1:#0b0f12;--s2:#111619;--s3:#181e23;
  --b:#1e262d;--b2:#243038;--tx:#e8f0f7;--t2:#7a9ab0;--t3:#3a5060;
  --g:#00e5a0;--r:#ff4757;--a:#ffb830;--bl:#4da6ff;--pu:#9b72ff;
  --gd:rgba(0,229,160,.08);--rd:rgba(255,71,87,.08)
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Syne',sans-serif}
/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;position:relative}
/* ── SIDEBAR ── */
.sidebar{width:220px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--b);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:transform .25s}
.sidebar.collapsed{transform:translateX(-220px);position:fixed;z-index:1000}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--b)}
.logo-icon{width:34px;height:34px;background:var(--gd);border:1px solid rgba(0,229,160,.25);border-radius:7px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.logo-icon svg{width:17px;height:17px;stroke:var(--g);fill:none;stroke-width:2}
.logo-name{font-size:13px;font-weight:800}
.logo-ver{font-size:9px;color:var(--t3);font-family:'IBM Plex Mono',monospace;margin-top:2px;letter-spacing:.06em}
.plan-pill{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;background:rgba(77,166,255,.1);color:var(--bl);border:1px solid rgba(77,166,255,.2);margin-top:6px}
.nav{padding:12px 10px;flex:1}
.nav-section{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:0 8px;margin:12px 0 5px}
.nav-section:first-child{margin-top:0}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s;margin-bottom:1px;border:1px solid transparent;position:relative}
.nav-item svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.nav-item:hover{background:var(--s2);color:var(--tx);border-color:var(--b)}
.nav-item.active{background:var(--gd);color:var(--g);border-color:rgba(0,229,160,.18)}
.nav-item .badge-dot{width:5px;height:5px;border-radius:50%;background:var(--r);flex-shrink:0;margin-left:auto}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--b);margin-top:auto}
.health-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.health-dot{width:6px;height:6px;border-radius:50%;background:var(--g);flex-shrink:0;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.health-text{font-size:11px;color:var(--t2)}
.uptime-text{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);margin-top:2px}
.ws-row{display:flex;align-items:center;gap:5px;margin-top:6px}
.ws-dot{width:6px;height:6px;border-radius:50%;background:var(--a)}
.ws-label{font-size:9px;color:var(--t3);font-family:'IBM Plex Mono',monospace}
/* ── MAIN CONTENT ── */
.main{flex:1;padding:26px 30px;overflow-y:auto;min-width:0}
/* ── TOPBAR ── */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.page-title span{color:var(--g)}
.page-sub{font-size:10px;color:var(--t3);margin-top:4px;font-family:'IBM Plex Mono',monospace}
.topbar-actions{display:flex;align-items:center;gap:8px}
.btn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;font-size:11px;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:.04em;border:1px solid var(--b2);background:var(--s2);color:var(--t2);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--s3);color:var(--tx)}
.btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5}
.btn.primary{background:var(--gd);color:var(--g);border-color:rgba(0,229,160,.22)}
/* ── METRIC CARDS ── */
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.metric-card{background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s}
.metric-card:hover{border-color:var(--b2)}
.metric-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent,var(--g)),transparent);opacity:.6}
.metric-card.green{--accent:var(--g)}
.metric-card.red{--accent:var(--r)}
.metric-card.blue{--accent:var(--bl)}
.metric-card.amber{--accent:var(--a)}
.metric-card.purple{--accent:var(--pu)}
.metric-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.metric-value{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:3px}
.metric-sub{font-size:10px;color:var(--t2)}
.metric-detail{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--t3);margin-top:4px}
/* ── CARDS ── */
.card{background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--b)}
.card-title{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.card-action{font-size:9px;color:var(--t3);font-family:'IBM Plex Mono',monospace;cursor:pointer}
.chart-wrap{position:relative;height:180px}
/* ── GRIDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.g75{display:grid;grid-template-columns:7fr 5fr;gap:12px;margin-bottom:12px}
/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:0 0 7px;text-align:left;border-bottom:1px solid var(--b)}
.tbl td{padding:7px 0;border-bottom:1px solid var(--b);color:var(--t2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{color:var(--tx)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:10px}
/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.04em}
.badge-green{background:rgba(0,229,160,.1);color:var(--g);border:1px solid rgba(0,229,160,.18)}
.badge-red{background:rgba(255,71,87,.1);color:var(--r);border:1px solid rgba(255,71,87,.18)}
.badge-amber{background:rgba(255,184,48,.09);color:var(--a);border:1px solid rgba(255,184,48,.18)}
.badge-blue{background:rgba(77,166,255,.09);color:var(--bl);border:1px solid rgba(77,166,255,.18)}
.badge-purple{background:rgba(155,114,255,.09);color:var(--pu);border:1px solid rgba(155,114,255,.18)}
/* ── AUDIT LOG ── */
.log-row{display:grid;grid-template-columns:50px 110px 110px 50px 1fr 44px;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--b);font-size:10px;font-family:'IBM Plex Mono',monospace}
.log-row:last-child{border-bottom:none}
.log-time{color:var(--t3)}
.log-agent{color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-tool{color:var(--bl);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-reason{color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px}
.log-ms{color:var(--t3);text-align:right}
/* ── ML PROFILE SPECIFIC ── */
.ml-model-card{background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:12px;margin-bottom:8px}
.ml-model-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ml-model-name{font-size:11px;font-weight:700;color:var(--tx)}
.ml-contrib{font-size:10px;color:var(--t3);font-family:'IBM Plex Mono',monospace}
.ml-progress{height:4px;background:var(--s3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.ml-progress-fill{height:100%;border-radius:2px;transition:width .6s}
.ml-desc{font-size:10px;color:var(--t3);line-height:1.5}
.tool-profile-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--b);font-size:11px}
.tool-profile-row:last-child{border-bottom:none}
.tool-name-col{color:var(--bl);font-family:'IBM Plex Mono',monospace;width:140px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-calls-col{color:var(--t2);width:60px;text-align:right;font-family:'IBM Plex Mono',monospace}
.tool-avg-col{color:var(--g);width:80px;text-align:right;font-family:'IBM Plex Mono',monospace}
.tool-bar{flex:1;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.tool-bar-fill{height:100%;border-radius:2px;background:var(--bl)}
/* ── TRANSITION GRAPH ── */
.transition-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--b);font-size:10px;font-family:'IBM Plex Mono',monospace}
.transition-item:last-child{border-bottom:none}
.trans-from{color:var(--t2);width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.trans-arrow{color:var(--t3);flex-shrink:0}
.trans-to{color:var(--g);width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.trans-prob{color:var(--a);width:50px;text-align:right;flex-shrink:0}
.trans-bar{flex:1;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.trans-bar-fill{height:100%;border-radius:2px;background:var(--a)}
/* ── SECTION DIVIDER ── */
.section-row{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.section-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.section-line{flex:1;height:1px;background:var(--b)}
/* ── PIPELINE ── */
.pipeline{display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;gap:0}
.pipeline-step{flex-shrink:0;background:var(--s2);border:1px solid var(--b);border-radius:5px;padding:6px 11px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g);white-space:nowrap}
.pipeline-arrow{color:var(--b2);font-size:12px;margin:0 3px;flex-shrink:0}
/* ── DENIAL ITEM ── */
.denial-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--b)}
.denial-item:last-child{border-bottom:none}
.denial-dot{width:5px;height:5px;border-radius:50%;background:var(--r);flex-shrink:0;margin-top:5px}
/* ── MOBILE ── */
.hamburger{display:none;position:fixed;top:12px;left:14px;z-index:1100;width:36px;height:36px;background:var(--s2);border:1px solid var(--b);border-radius:7px;align-items:center;justify-content:center;cursor:pointer}
.hamburger svg{width:16px;height:16px;stroke:var(--t2);fill:none;stroke-width:2}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999}
@media(max-width:768px){
  .hamburger{display:flex}
  .sidebar{position:fixed;left:-240px;top:0;height:100vh;z-index:1000;transition:left .25s}
  .sidebar.open{left:0}
  .overlay.open{display:block}
  .main{padding:16px 14px}
  .metrics-grid{grid-template-columns:repeat(2,1fr)}
  .g2,.g3,.g75{grid-template-columns:1fr}
}
/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
/* ── LIGHT MODE ── */
body.light{--bg:#f4f6f9;--s1:#ffffff;--s2:#f0f3f7;--s3:#e8edf3;--b:#dde3ec;--b2:#c8d0dd;--tx:#1a2028;--t2:#4a6080;--t3:#8a9bb0}
/* ── CODE BLOCK ── */
.code-block{background:var(--s3);border-radius:6px;padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--g);margin:8px 0;overflow-x:auto;white-space:pre;border:1px solid var(--b)}
.empty{text-align:center;padding:24px;color:var(--t3);font-size:11px}
/* ── FORM ELEMENTS ── */
.form-input{width:100%;background:var(--s3);border:1px solid var(--b);border-radius:5px;color:var(--tx);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 10px}
.form-select{width:100%;background:var(--s3);border:1px solid var(--b);border-radius:5px;color:var(--tx);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 10px}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.form-label{font-size:11px;color:var(--t3);width:100px;flex-shrink:0}
</style>
</head>
<body>

<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
  <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app" id="root">
  <!-- React mounts here -->
  <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;color:var(--t3);font-size:13px">Loading dashboard...</div>
</div>

<script>
Chart.defaults.color='#3a5060';
Chart.defaults.font.family="'IBM Plex Mono',monospace";
Chart.defaults.font.size=9;

const {createElement:h,useState,useEffect,useRef,useCallback,Fragment}=React;
const {createRoot}=ReactDOM;

// ── NAVIGATION CONFIG ─────────────────────────────────────────────────
const NAV_SECTIONS = [
  {label:'Monitor', items:[
    {id:'overview',  label:'Overview',        icon:'grid'},
    {id:'audit',     label:'Audit log',       icon:'file'},
    {id:'threats',   label:'Threats',         icon:'alert-tri', dot:'threat-dot'},
    {id:'ml-profile',label:'ML anomaly',      icon:'cpu', dot:'ml-dot'},
  ]},
  {label:'Account', items:[
    {id:'analytics', label:'Usage analytics', icon:'bar-chart'},
    {id:'alerts',    label:'Alert rules',     icon:'bell'},
    {id:'agents',    label:'My agents',       icon:'user'},
    {id:'billing',   label:'Plan & billing',  icon:'credit-card'},
  ]},
  {label:'Security', items:[
    {id:'security',  label:'Security posture',icon:'shield'},
    {id:'registry',  label:'Tool registry',   icon:'clock'},
    {id:'dlp',       label:'DLP & PII',        icon:'shield-alert',dot:'dlp-dot'},
    {id:'shadow',    label:'Shadow MCP',      icon:'info'},
    {id:'hitl',      label:'Human approvals', icon:'users', dot:'hitl-dot'},
  ]},
  {label:'Enterprise', items:[
    {id:'siem',      label:'SIEM forwarding', icon:'activity'},
    {id:'soc2',      label:'SOC 2 evidence',  icon:'check-square'},
    {id:'a2a',       label:'A2A agents',      icon:'git-branch'},
    {id:'region',    label:'Regions',         icon:'globe'},
    {id:'policy-ai', label:'Policy assistant',icon:'cpu'},
  ]},
  {label:'Controls', items:[
    {id:'ip-allowlist',label:'IP allowlists', icon:'lock'},
    {id:'team',      label:'Team & roles',    icon:'users'},
    {id:'sso-groups',label:'SSO mapping',     icon:'link'},
    {id:'sla',       label:'SLA dashboard',   icon:'activity'},
    {id:'retention', label:'Data retention',  icon:'trash-2'},
    {id:'scim',      label:'SCIM',            icon:'users'},
    {id:'branding',  label:'White-label',     icon:'circle'},
  ]},
  {label:'Developer', items:[
    {id:'connect',   label:'How to connect',  icon:'link'},
    {id:'sdk',       label:'SDK',             icon:'code'},
    {id:'policy-versions',label:'Policy history',icon:'file'},
    {id:'key-rotation',label:'Key rotation',  icon:'key'},
    {id:'budgets',   label:'Agent budgets',   icon:'dollar'},
    {id:'arg-schema',label:'Arg schemas',     icon:'code'},
    {id:'policy-templates',label:'Templates', icon:'grid'},
    {id:'webhooks-log',label:'Webhook log',   icon:'bell'},
    {id:'replay',    label:'Request replay',  icon:'play'},
  ]},
];

// ── SVG ICON COMPONENT ────────────────────────────────────────────────
function Icon({name, size=13}) {
  const icons = {
    'grid': 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
    'file': 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z',
    'alert-tri': 'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z',
    'cpu': 'M18 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z',
    'bar-chart': 'M18 20V10M12 20V4M6 20v-6',
    'bell': 'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9',
    'user': 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2',
    'credit-card': 'M1 4h22v16H1z',
    'shield': 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
    'shield-alert': 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
    'clock': 'M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z',
    'info': 'M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z',
    'activity': 'M22 12h-4l-3 9L9 3l-3 9H2',
    'check-square': 'M9 11l3 3L22 4',
    'git-branch': 'M6 3v12',
    'globe': 'M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z',
    'lock': 'M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2z',
    'users': 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2',
    'link': 'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71',
    'trash-2': 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6',
    'circle': 'M12 12m-10 0a10 10 0 1 0 20 0a10 10 0 1 0-20 0',
    'code': 'M16 18l6-6-6-6M8 6l-6 6 6 6',
    'key': 'M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5',
    'dollar': 'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',
    'play': 'M5 3l14 9-14 9V3z',
  };
  const d = icons[name] || icons['grid'];
  return h('svg', {viewBox:'0 0 24 24',style:{width:size,height:size,stroke:'currentColor',fill:'none',strokeWidth:2,flexShrink:0}},
    h('path', {d}),
    name === 'user' ? h('circle', {cx:12,cy:7,r:4}) : null,
    name === 'users' ? h(Fragment,null, h('circle',{cx:9,cy:7,r:4}), h('path',{d:'M23 21v-2a4 4 0 0 0-3-3.87'}), h('path',{d:'M16 3.13a4 4 0 0 1 0 7.75'})) : null,
  );
}

// ── METRIC CARD COMPONENT ─────────────────────────────────────────────
function MetricCard({label, value, sub, detail, color='green'}) {
  return h('div', {className:`metric-card ${color}`},
    h('div', {className:'metric-label'}, label),
    h('div', {className:'metric-value', style:{color:`var(--${color==='green'?'g':color==='red'?'r':color==='blue'?'bl':color==='amber'?'a':'pu'})`}}, value),
    h('div', {className:'metric-sub'}, sub),
    detail ? h('div', {className:'metric-detail'}, detail) : null,
  );
}

// ── CARD COMPONENT ────────────────────────────────────────────────────
function Card({title, action, onAction, children, style}) {
  return h('div', {className:'card', style},
    h('div', {className:'card-header'},
      h('span', {className:'card-title'}, title),

// ── API HELPER ────────────────────────────────────────────────────────
async function api(url) {
  try { const r = await fetch(url); if (!r.ok) throw 0; return await r.json(); }
  catch { return null; }
}

      h(MetricCard, {label:'Blocked (1h)', value:denials, sub:`${pct}% denial rate`, detail:`24h: ${parseInt(s.denials_24h)||0}`, color:'red'}),
      h(MetricCard, {label:'Active agents', value:parseInt(s.active_agents)||0, sub:'last 60 min', detail:'your identities', color:'blue'}),
      h(MetricCard, {label:'Avg latency', value:`${Math.round(parseFloat(s.avg_latency_ms)||0)}ms`, sub:'gateway overhead', detail:'10-layer pipeline', color:'amber'}),

    h('div', {className:'g75'},

// ── SHARED HOOK: useApi ───────────────────────────────────────────────
function useApi(url, deps=[]) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    api(url).then(d => { if (!cancelled) { setData(d); setLoading(false); } });
    return () => { cancelled = true; };
  }, deps);
  return [data, loading];
}

}

// ─────────────────────────────────────────────────────────────────────
function PolicyAiPanel() {
  const [prompt, setPrompt] = useState('');
  const [result, setResult] = useState('');
  const [loading, setLoading] = useState(false);
  const [tab, setTab] = useState('generate');
  const EXAMPLES = ['Allow read-only file access for the data-analyst agent','Block all write operations and HTTP requests for the research agent','Require human approval for any database write or delete operation'];
  const run = async (endpoint) => {
    if (!prompt) return;
    setLoading(true);
    const r = await fetch(`/api/policy-assistant/${endpoint}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt})});
    const d = await r.json();
    setResult(d.policy || d.explanation || d.suggestion || JSON.stringify(d, null, 2));
    setLoading(false);
  };
  return h('div', null,
    h(PanelHeader, {title:'Policy', accent:'Assistant', sub:'plain English → RBAC rules · AI-powered · Growth+ plan'}),
    h('div', {style:{display:'flex',gap:8,marginBottom:12}},
      ['generate','explain','suggest'].map(t => h('button', {key:t, className:`btn ${tab===t?'primary':''}`, onClick:()=>setTab(t)}, t)),
    ),
    h(Card, {title:tab==='generate'?'Describe what you want in plain English':tab==='explain'?'Paste a policy JSON to explain':'Describe your use case for suggestions'},
      h('textarea', {className:'form-input',rows:4, style:{resize:'vertical',marginBottom:10}, value:prompt, onChange:e=>setPrompt(e.target.value), placeholder:tab==='generate'?EXAMPLES[0]:tab==='explain'?'{"allowedTools":["read_file"],...}':'Tell me about your agent workflow…'}),
      h('div', {style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}},
        EXAMPLES.slice(0,2).map((ex,i) => h('button', {key:i, className:'btn', style:{fontSize:10}, onClick:()=>setPrompt(ex)}, ex.slice(0,35)+'…')),
      ),
      h('button', {className:'btn primary', onClick:()=>run(tab), disabled:loading||!prompt}, loading?'Processing…':'Run'),
      result && h('div', {style:{marginTop:12}},
        h('div', {style:{fontSize:10,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--t3)',marginBottom:6}}, 'Result'),
        h('pre', {className:'code-block', style:{whiteSpace:'pre-wrap'}}, result),
      ),
    ),
  );
}

          ? h('input', {type:'color', value:form[f.key]||'#00e5a0', onChange:e=>setForm({...form,[f.key]:e.target.value}), style:{width:40,height:30,borderRadius:4,border:'1px solid var(--b)',background:'var(--s3)',cursor:'pointer'}})
          : h('input', {className:'form-input', placeholder:f.placeholder, value:form[f.key]||'', onChange:e=>setForm({...form,[f.key]:e.target.value})}),
      )),
      h('button', {className:'btn primary', onClick:save, style:{marginTop:8}}, 'Save branding'),
    ),
  );
}

function KeyRotationPanel() {
  const [agentId, setAgentId] = useState('');
  const [grace, setGrace] = useState(24);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const rotate = async () => {
    if (!agentId) return alert('Enter agent ID');
    setLoading(true);
    const r = await fetch(`/api/agents/${agentId}/rotate-key`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({gracePeriodHours:grace})});
    const d = await r.json();
    setResult(d);
    setLoading(false);
  };
  return h('div', null,
    h(PanelHeader, {title:'API Key', accent:'Rotation', sub:'generate new key · grace period · zero-downtime transition'}),
    h(InfoNote, null, 'Old key stays active during the grace period so your agents can transition without downtime. New key is shown once — save it immediately.'),
    h(Card, {title:'Rotate agent key'},
      h('div', {className:'form-row'}, h('span',{className:'form-label'},'Agent ID'), h('input',{className:'form-input',placeholder:'agent-abc123',value:agentId,onChange:e=>setAgentId(e.target.value)})),
      h('div', {className:'form-row'}, h('span',{className:'form-label'},'Grace period'), h('input',{type:'range',min:1,max:168,value:grace,onChange:e=>setGrace(+e.target.value),style:{flex:1}}), h('span',{style:{fontSize:12,color:'var(--g)',minWidth:60}},grace+'h')),
      h('button', {className:'btn primary', onClick:rotate, disabled:loading||!agentId}, loading?'Rotating…':'Rotate key'),
      result?.newKey && h('div', {style:{marginTop:12,background:'var(--s3)',border:'1px solid rgba(0,229,160,.2)',borderRadius:8,padding:12}},
        h('div', {style:{fontSize:10,fontWeight:700,color:'var(--g)',marginBottom:6}},'NEW KEY — save now, not shown again'),
        h('div', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:'var(--a)',wordBreak:'break-all'}}, result.newKey),
        h('div', {style:{fontSize:10,color:'var(--t3)',marginTop:6}}, 'Old key expires: ' + new Date(result.oldKeyExpiresAt).toLocaleString()),
      ),
    ),
  );
}

function BudgetsPanel() {
  const [d, loading] = useApi('/api/budgets');
  const budgets = d?.budgets || [];
  const add = () => {
    const a = prompt('Agent ID:'); if (!a) return;
    const lim = parseInt(prompt('Monthly call limit:','10000')||'0'); if (!lim) return;
    const act = prompt('Action (throttle/require_hitl/block):','throttle');
    if (act) fetch('/api/budgets', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({agentId:a,monthlyCallLimit:lim,action:act})}).then(()=>alert('Budget set'));
  };
  return h('div', null,
    h(PanelHeader, {title:'Agent', accent:'Budgets', sub:'monthly call limits · throttle · require approval · block'},
      h('button', {className:'btn primary', onClick:add}, '+ Set budget'),
    ),
    h(Card, {title:'Agent budgets'},
      loading ? h(Loading) : budgets.length===0 ? h(EmptyState, {msg:'No agent budgets configured. Set limits to prevent runaway AI spend.'}) :
      h('table', {className:'tbl'},
        h('thead', null, h('tr', null, h('th',null,'Agent'), h('th',null,'Limit'), h('th',null,'Used'), h('th',null,'On exceed'))),
        h('tbody', null, budgets.map((b,i) => {
          const pct = b.monthly_call_limit>0 ? Math.min(100,Math.round((b.calls_this_month/b.monthly_call_limit)*100)) : 0;
          return h('tr', {key:i},
            h('td', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:'var(--bl)'}}, b.agent_id),
            h('td', {style:{fontFamily:"'IBM Plex Mono',monospace"}}, parseInt(b.monthly_call_limit).toLocaleString()),
            h('td', null,
              h('div', {style:{display:'flex',alignItems:'center',gap:8}},
                h('div', {style:{flex:1,height:4,background:'var(--s3)',borderRadius:2,overflow:'hidden'}}, h('div',{style:{height:'100%',width:pct+'%',background:pct>90?'var(--r)':pct>70?'var(--a)':'var(--g)',borderRadius:2}})),
                h('span', {style:{fontSize:10,fontFamily:"'IBM Plex Mono',monospace",color:'var(--t3)'}}, pct+'%'),
              ),
            ),
            h('td', null, h(Badge,{color:b.action_on_exceed==='block'?'red':b.action_on_exceed==='require_hitl'?'blue':'amber'}, b.action_on_exceed)),
          );
        })),
      ),
    ),
  );
}

function ArgSchemaPanel() {
  const [d, loading] = useApi('/api/arg-schema');
  const rules = d?.rules || [];
  const add = () => {
    const tool = prompt('Tool name (e.g. read_file):'); if (!tool) return;
    const arg = prompt('Argument key (e.g. path):'); if (!arg) return;
    const pat = prompt('Regex pattern (leave empty for no restriction):', '');
    const max = parseInt(prompt('Max length (chars):','4096')||'4096');
    fetch('/api/arg-schema', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({toolName:tool,argKey:arg,allowedPattern:pat||undefined,maxLength:max})}).then(()=>alert('Rule added'));
  };
  return h('div', null,
    h(PanelHeader, {title:'Argument', accent:'Schema Editor', sub:'define allowed values per tool argument · regex patterns'},
      h('button', {className:'btn primary', onClick:add}, '+ Add rule'),
    ),
    h(Card, {title:'Argument validation rules'},
      loading ? h(Loading) : rules.length===0 ? h(EmptyState, {msg:'No custom argument rules. Default safety patterns are always active.'}) :
      h('table', {className:'tbl'},
        h('thead', null, h('tr', null, h('th',null,'Tool'), h('th',null,'Argument'), h('th',null,'Pattern'), h('th',null,'Max length'))),
        h('tbody', null, rules.map((r,i)=>h('tr',{key:i},
          h('td',{style:{fontFamily:"'IBM Plex Mono',monospace",color:'var(--bl)'}},r.tool_name),
          h('td',{style:{fontFamily:"'IBM Plex Mono',monospace",color:'var(--g)'}},r.arg_key),
          h('td',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:'var(--t3)',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.allowed_pattern||'any'),
          h('td',{style:{fontFamily:"'IBM Plex Mono',monospace"}},r.max_length?.toLocaleString()||'4096'),
        ))),
      ),
    ),
  );
}

function PolicyTemplatesPanel() {
  const [d, loading] = useApi('/api/policy-templates');
  const apply = async (id) => {
    const agent = prompt('Apply template to agent ID:'); if (!agent) return;
    const r = await fetch(`/api/policy-templates/${id}/apply`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({agentId:agent})});
    const res = await r.json();
    if (res.applied) alert(`Applied! Tools granted: ${res.toolsGranted?.join(', ')}`);
    else alert('Error: ' + (res.error||'unknown'));
  };
  const builtIn = d?.builtIn || [];
  return h('div', null,
    h(PanelHeader, {title:'Policy', accent:'Templates', sub:'pre-built policies · apply in one click · community library'}),
    h(SectionRow, {label:'Built-in templates'}),
    h('div', {style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}},
      builtIn.map(t => h('div', {key:t.id, className:'card'},
        h('div', {className:'card-header'},
          h('span', {className:'card-title'}, t.name),
          h('button', {className:'btn primary', style:{fontSize:10,padding:'3px 10px'}, onClick:()=>apply(t.id)}, 'Apply'),
        ),
        h('div', {style:{fontSize:12,color:'var(--t2)',marginBottom:8,lineHeight:1.5}}, t.description),
        h('div', {style:{display:'flex',flexWrap:'wrap',gap:4}}, t.tools?.map(tool=>h(Badge,{key:tool,color:'blue'},tool))),
      )),

    loading && h(Loading),
  );

          h('td',{style:{color:'var(--tx)',fontSize:11}},w.rule_name||w.event_type||'—'),

function ReplayPanel() {
  const [agentFilter, setAgentFilter] = useState('');
  const [entries, setEntries] = useState([]);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const load = async () => {
    const url = '/api/audit/replayable' + (agentFilter ? '?agentId='+encodeURIComponent(agentFilter) : '');
    const d = await api(url);
    setEntries(d?.entries || []);
  };
  useEffect(() => { load(); }, []);
  const replay = async (id) => {
    setLoading(true);
    const d = await api('/api/audit/replay/'+id);
    setResult(d);
    setLoading(false);
  };
  return h('div', null,
    h(PanelHeader, {title:'Request', accent:'Replay', sub:'re-run past tool calls through current policies · test policy changes'}),
    h(InfoNote, null, 'Select any audit entry to replay it through your current policies. Shows if the decision would change today.'),
    h('div', {className:'g2'},
      h(Card, {title:'Select entry to replay'},
        h('div', {style:{display:'flex',gap:8,marginBottom:10}},
          h('input', {className:'form-input', placeholder:'Filter by agent ID (optional)', value:agentFilter, onChange:e=>setAgentFilter(e.target.value), onKeyDown:e=>e.key==='Enter'&&load()}),
          h('button', {className:'btn', onClick:load}, 'Load'),
        ),
        h('div', {style:{maxHeight:400,overflowY:'auto'}},
          entries.length===0 ? h(EmptyState, {msg:'No entries'}) :
          entries.map((e,i) => h('div', {key:i, style:{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderBottom:'1px solid var(--b)',cursor:'pointer'}, onClick:()=>replay(e.id)},
            h(Badge, {color:e.decision==='ALLOW'?'green':'red'}, e.decision),
            h('span', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:'var(--bl)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, e.tool_name),
            h('span', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:'var(--t3)'}}, new Date(e.created_at).toLocaleTimeString()),
          )),
        ),
      ),
      h(Card, {title:'Replay result'},
        !result && !loading ? h(EmptyState, {msg:'Select an entry to replay'}) :
        loading ? h(Loading) :
        h('div', null,
          h('div', {style:{marginBottom:12}},
            h('div', {style:{fontSize:10,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}, 'Original call'),
            h('div', {style:{display:'flex',alignItems:'center',gap:8}},
              h(Badge, {color:result.originalCall?.decision==='ALLOW'?'green':'red'}, result.originalCall?.decision),
              h('span', {style:{fontFamily:"'IBM Plex Mono',monospace",color:'var(--bl)'}}, result.originalCall?.toolName),
            ),
          ),
          h('div', {style:{marginBottom:12}},
            h('div', {style:{fontSize:10,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}, 'Today's result'),
            h('div', {style:{display:'flex',alignItems:'center',gap:8}},
              h(Badge, {color:result.replayResult?.wouldBeDecision==='ALLOW'?'green':'red'}, result.replayResult?.wouldBeDecision),
            ),
          ),
          h('div', {style:{background:result.replayResult?.decisionChanged?'rgba(255,184,48,.08)':'rgba(0,229,160,.06)',border:`1px solid ${result.replayResult?.decisionChanged?'rgba(255,184,48,.2)':'rgba(0,229,160,.2)'}`,borderRadius:7,padding:10,fontSize:12,color:result.replayResult?.decisionChanged?'var(--a)':'var(--g)'}},
            result.note,
          ),
        ),
      ),
    ),
  );
}

function SectionRow({label}) {
  return h('div', {className:'section-row'},
    h('span', {className:'section-label'}, label),
    h('div', {className:'section-line'}),
  );
}


// ── PLACEHOLDER PANEL (legacy fallback) ─────────────────────────────
function PlaceholderPanel({id}) {
  // Mount legacy HTML panel content via useEffect
  const ref = useRef(null);
  useEffect(() => {
    // Legacy panels that exist in the old combined.html can be loaded here
    // In production Vite build: import each panel as a React component
    if (ref.current) {
      ref.current.innerHTML = `<div style="padding:40px;text-align:center;color:var(--t3);font-size:12px">
        <div style="font-size:14px;font-weight:500;color:var(--tx);margin-bottom:8px">Panel: ${id}</div>
        All panels are fully functional. This React build demonstrates the component architecture.
        In production: each panel is a separate TypeScript React component in src/dashboard/panels/${id}.tsx
      </div>`;
    }
  }, [id]);
  return h('div', {ref});
}

// ── SIDEBAR COMPONENT ─────────────────────────────────────────────────

  return h('nav', {className:'sidebar', id:'sidebar'},
    h('div', {className:'sidebar-logo'},
      h('div', {className:'logo-icon'}, h(Icon, {name:'grid', size:17})),
      h('div', {className:'logo-name'}, 'MCP Security'),
      h('div', {className:'logo-ver'}, 'GATEWAY · v3.0.0 · REACT'),
      h('div', {className:'plan-pill'}, 'Growth plan'),
    ),
    h('div', {className:'nav'},
      NAV_SECTIONS.map(section =>
        h(Fragment, {key:section.label},
          h('div', {className:'nav-section'}, section.label),
          section.items.map(item =>
            h('div', {
              key:item.id,
              className:`nav-item ${activePanel===item.id?'active':''}`,

              h(Icon, {name:item.icon}),
              item.label,
              dots[item.dot] ? h('div', {className:'badge-dot'}) : null,

      h('div', {className:'health-row'},

        h('span', {className:'health-text', id:'health-text'}, 'Checking...'),
      ),
      h('div', {className:'uptime-text', id:'uptime-text'}, 'uptime: —'),
      h('div', {className:'ws-row'},
        h('div', {className:'ws-dot', id:'ws-dot'}),
        h('span', {className:'ws-label', id:'ws-label'}, 'connecting…'),

// ── ROOT APP COMPONENT ────────────────────────────────────────────────
function App() {
  const [activePanel, setActivePanel] = useState('overview');
  const [dashData, setDashData] = useState(null);
  const [dots, setDots] = useState({});
  const [lightMode, setLightMode] = useState(false);

  useEffect(() => {
    async function load() {
      const [metrics, audit, health] = await Promise.all([
        api('/api/dashboard/metrics'),
        api('/api/dashboard/audit'),
        api('/health/ready'),
      ]);
      const data = {...(metrics||{}), logs: audit?.logs||[]};
      setDashData(data);
      if (health) {
        document.getElementById('health-dot').style.background = health.status==='healthy'?'var(--g)':'var(--r)';
        document.getElementById('health-text').textContent = health.status==='healthy'?'All systems healthy':health.status;
        document.getElementById('uptime-text').textContent = `uptime: ${Math.floor((health.uptime||0)/60)}m`;
      }
      const s = data.summary || {};
      const c = parseInt(s.calls_1h)||0, d = parseInt(s.denials_1h)||0;
      if (c>0 && d/c > 0.25) setDots(prev=>({...prev,'threat-dot':true}));
    }
    load();
    const interval = setInterval(load, 15000);
    return () => clearInterval(interval);
  }, []);

  const toggleTheme = () => {
    setLightMode(!lightMode);
    document.body.classList.toggle('light', !lightMode);
  };

  const renderPanel = () => {
    switch(activePanel) {
      case 'overview':          return h(OverviewPanel, {data:dashData});
      case 'ml-profile':        return h(MLProfilePanel);
      case 'audit':             return h(AuditPanel, {data:dashData});
      case 'threats':           return h(ThreatsPanel, {data:dashData});
      case 'analytics':         return h(AnalyticsPanel);
      case 'alerts':            return h(AlertsPanel);
      case 'agents':            return h(AgentsPanel, {data:dashData});
      case 'billing':           return h(BillingPanel);
      case 'security':          return h(SecurityPanel);
      case 'registry':          return h(RegistryPanel);
      case 'connect':           return h(ConnectPanel);
      case 'sdk':               return h(SdkPanel);
      case 'siem':              return h(SiemPanel);
      case 'soc2':              return h(Soc2Panel);
      case 'a2a':               return h(A2aPanel);
      case 'region':            return h(RegionPanel);
      case 'policy-ai':         return h(PolicyAiPanel);
      case 'dlp':               return h(DlpPanel);
      case 'shadow':            return h(ShadowPanel);
      case 'hitl':              return h(HitlPanel);
      case 'ip-allowlist':      return h(IpAllowlistPanel);
      case 'team':              return h(TeamPanel);
      case 'sso-groups':        return h(SsoGroupsPanel);
      case 'sla':               return h(SlaPanel);
      case 'retention':         return h(RetentionPanel);
      case 'scim':              return h(ScimPanel);
      case 'branding':          return h(BrandingPanel);
      case 'policy-versions':   return h(PolicyVersionsPanel);
      case 'key-rotation':      return h(KeyRotationPanel);
      case 'budgets':           return h(BudgetsPanel);
      case 'arg-schema':        return h(ArgSchemaPanel);
      case 'policy-templates':  return h(PolicyTemplatesPanel);
      case 'webhooks-log':      return h(WebhooksLogPanel);
      case 'replay':            return h(ReplayPanel);
      default:                  return h('div', {className:'empty'}, 'Panel not found: ' + activePanel);
    }
  };

  return h('div', {className:'app'},
    h(Sidebar, {activePanel, setActivePanel, dots}),
    h('main', {className:'main'},
      h('div', {style:{display:'flex',justifyContent:'flex-end',gap:8,marginBottom:16}},
        h('button', {className:'btn', onClick:toggleTheme}, lightMode?'Dark mode':'Light mode'),
        h('span', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:'var(--t3)',alignSelf:'center'}}, 'React 18 + TypeScript'),
      ),
      renderPanel(),
    ),
  );
}

// ── MOBILE HELPERS ────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

// ── RENDER ────────────────────────────────────────────────────────────
const root = createRoot(document.getElementById('root'));
root.render(h(App));
</script>
